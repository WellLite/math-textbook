<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">单位圆上的正弦和余弦</title>
<desc id="desc">半径 OP 转过角 θ。点 P 在横轴、纵轴上的投影分别读作 cos θ、sin θ。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#677b80"/></marker></defs>
<rect width="480" height="340" rx="12" fill="#f8faf7"/>
<g font-family="Georgia,'Times New Roman',serif">
<circle cx="233" cy="172" r="120" fill="none" stroke="#087c74" stroke-width="2.6"/>
<line x1="60" y1="172" x2="411" y2="172" stroke="#677b80" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="233" y1="316" x2="233" y2="22" stroke="#677b80" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="305" y1="76" x2="305" y2="172" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="233" y1="76" x2="305" y2="76" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="233" y1="172" x2="305" y2="76" stroke="#ad4d21" stroke-width="3.3" />
<path d="M263 172 A30 30 0 0 0 251 148" fill="none" stroke="#ad4d21" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M297 172 v-8 h8" fill="none" stroke="#677b80" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="233" cy="172" r="4" fill="#203d43"/>
<circle cx="305" cy="76" r="4" fill="#ad4d21"/>
<text x="221" y="194" text-anchor="middle" fill="#203d43" font-size="20">O</text>
<text x="317" y="68" text-anchor="middle" fill="#ad4d21" font-size="20">P</text>
<text x="270" y="156" text-anchor="middle" fill="#ad4d21" font-size="20">θ</text>
<text x="305" y="197" text-anchor="middle" fill="#087c74" font-size="20">cos θ</text>
<text x="222" y="82" text-anchor="end" fill="#087c74" font-size="20">sin θ</text>
<text x="419" y="179" text-anchor="middle" fill="#203d43" font-size="20">x</text>
<text x="249" y="27" text-anchor="middle" fill="#203d43" font-size="20">y</text>
<text x="355" y="194" text-anchor="middle" fill="#677b80" font-size="16">1</text>
</g>
</svg>
