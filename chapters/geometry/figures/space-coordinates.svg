<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">空间点的地面投影</title>
<desc id="desc">从原点 O 先沿 x 再沿 y 走到 H，最后沿 z 方向升到 P。OH、HP 是空间直角三角形的两条直角边。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#677b80"/></marker></defs>
<rect width="480" height="340" rx="12" fill="#f8faf7"/>
<g font-family="Georgia,'Times New Roman',serif">
<line x1="143" y1="213" x2="425" y2="213" stroke="#677b80" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="143" y1="213" x2="41" y2="303" stroke="#677b80" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="143" y1="213" x2="143" y2="24" stroke="#677b80" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="143" y1="213" x2="338" y2="213" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="338" y1="213" x2="274" y2="269" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="143" y1="213" x2="79" y2="269" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="79" y1="269" x2="274" y2="269" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="143" y1="213" x2="274" y2="269" stroke="#087c74" stroke-width="2.5" />
<line x1="274" y1="269" x2="274" y2="102" stroke="#ad4d21" stroke-width="2.8" />
<line x1="143" y1="213" x2="274" y2="102" stroke="#087c74" stroke-width="2.5" />
<circle cx="143" cy="213" r="4" fill="#203d43"/>
<circle cx="274" cy="269" r="4" fill="#203d43"/>
<circle cx="274" cy="102" r="4" fill="#ad4d21"/>
<text x="135" y="235" text-anchor="middle" fill="#203d43" font-size="20">O</text>
<text x="291" y="285" text-anchor="middle" fill="#203d43" font-size="20">H</text>
<text x="286" y="95" text-anchor="middle" fill="#ad4d21" font-size="20">P</text>
<text x="432" y="219" text-anchor="middle" fill="#203d43" font-size="20">x</text>
<text x="34" y="319" text-anchor="middle" fill="#203d43" font-size="20">y</text>
<text x="155" y="28" text-anchor="middle" fill="#203d43" font-size="20">z</text>
<text x="239" y="204" text-anchor="middle" fill="#677b80" font-size="20">x</text>
<text x="327" y="252" text-anchor="middle" fill="#677b80" font-size="20">y</text>
<text x="286" y="189" text-anchor="middle" fill="#ad4d21" font-size="20">z</text>
</g>
</svg>
