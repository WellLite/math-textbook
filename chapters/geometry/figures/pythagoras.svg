<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">四张三角形拼出的面积等式</title>
<desc id="desc">四角各放一张同样的直角三角形。大正方形每边长 a+b，中间小正方形每边都是三角形的斜边 c。</desc>
<rect width="480" height="340" rx="12" fill="#f8faf7"/>
<g font-family="Georgia,'Times New Roman',serif" fill="#203d43" text-anchor="middle" font-size="20">
<rect x="120" y="52" width="240" height="240" fill="#f1e7d7" stroke="#203d43" stroke-width="2.4"/>
<path d="M264 52 L360 196 L216 292 L120 148 Z" fill="#d7eae5" stroke="#087c74" stroke-width="3"/>
<path d="M120 64 h12 v-12 M348 52 v12 h12 M360 280 h-12 v12 M132 292 v-12 h-12" fill="none" stroke="#6b7874" stroke-width="1.3"/>
<text x="193" y="42">a</text><text x="312" y="42">b</text><text x="107" y="107">b</text>
<text x="243" y="178" fill="#087c74" font-size="26">c²</text><text x="311" y="110" fill="#087c74">c</text>
<circle cx="264" cy="52" r="3.1" fill="#087c74"/><circle cx="360" cy="196" r="3.1" fill="#087c74"/><circle cx="216" cy="292" r="3.1" fill="#087c74"/><circle cx="120" cy="148" r="3.1" fill="#087c74"/>
</g></svg>
