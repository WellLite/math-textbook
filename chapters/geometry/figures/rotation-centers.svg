<svg xmlns="http://www.w3.org/2000/svg" width="560" height="280" viewBox="0 0 360 180" role="img" aria-labelledby="title desc">
  <title id="title">同一个转角，两个不同的旋转中心</title>
  <desc id="desc">虚线是相同的起始轮廓。左边绕 A 逆时针转九十度，B 转到 A 的正上方。右边绕 B 逆时针转九十度，A 转到 B 的正下方。圆点标出各自不动的中心。</desc>
  <rect width="360" height="180" rx="10" fill="#f8faf7"/>
  <path d="M180 14V166" stroke="#d8dfdb"/>
  <g fill="#203d43" font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">
    <text x="90" y="25">按住 A 转</text>
    <text x="270" y="25">按住 B 转</text>
  </g>
  <g fill="#d6eee8" stroke="#08746e" stroke-width="2.5" stroke-linejoin="round">
    <path d="M65 106 L65 52 L39 87 Z"/>
    <path d="M299 160 L299 106 L273 141 Z"/>
  </g>
  <g fill="none" stroke="#56666c" stroke-width="1.8" stroke-dasharray="5 4" stroke-linejoin="round">
    <path d="M65 106 L119 106 L84 80 Z"/>
    <path d="M245 106 L299 106 L264 80 Z"/>
  </g>
  <g fill="#9c461f">
    <circle cx="65" cy="106" r="3.8"/>
    <circle cx="299" cy="106" r="3.8"/>
  </g>
  <g fill="#203d43" font-family="Georgia,serif" font-size="16">
    <text x="54" y="124">A</text><text x="122" y="112">B</text>
    <text x="231" y="111">A</text><text x="305" y="112">B</text>
  </g>
</svg>
