<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="title desc">
<title id="title">椭圆的两条焦半径</title>
<desc id="desc">两根从焦点拉向 P 的线段组成同一根绷紧的绳。横轴两端在长轴上，纵轴上端位于两焦点的正中间上方。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#677b80"/></marker></defs>
<rect width="480" height="340" rx="12" fill="#f8faf7"/>
<g font-family="Georgia,'Times New Roman',serif">
<line x1="40" y1="168" x2="440" y2="168" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<line x1="240" y1="24" x2="240" y2="313" stroke="#677b80" stroke-width="1.6" stroke-dasharray="5 5"/>
<ellipse cx="240" cy="168" rx="150" ry="120" fill="none" stroke="#087c74" stroke-width="3"/>
<line x1="150" y1="168" x2="330" y2="72" stroke="#ad4d21" stroke-width="3" />
<line x1="330" y1="168" x2="330" y2="72" stroke="#ad4d21" stroke-width="3" />
<circle cx="150" cy="168" r="4" fill="#203d43"/>
<circle cx="330" cy="168" r="4" fill="#203d43"/>
<circle cx="330" cy="72" r="4" fill="#ad4d21"/>
<circle cx="240" cy="48" r="4" fill="#087c74"/>
<text x="145" y="194" text-anchor="middle" fill="#203d43" font-size="20">F₁</text>
<text x="333" y="194" text-anchor="middle" fill="#203d43" font-size="20">F₂</text>
<text x="342" y="66" text-anchor="middle" fill="#ad4d21" font-size="20">P</text>
<text x="236" y="111" text-anchor="middle" fill="#ad4d21" font-size="20">u</text>
<text x="344" y="125" text-anchor="middle" fill="#ad4d21" font-size="20">v</text>
<text x="225" y="192" text-anchor="middle" fill="#677b80" font-size="20">O</text>
<text x="250" y="40" text-anchor="start" fill="#677b80" font-size="16">(0, b)</text>
</g>
</svg>
