<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 218" role="img" aria-labelledby="title desc">
  <title id="title">沿增广路换座</title>
  <desc id="desc">左图甲坐一号，右图甲换到二号，乙坐一号。</desc>
  <style>
    text { font: 17px system-ui, sans-serif; fill: #244a48; }
    .label { font-size: 15px; } .small { font-size: 13px; }
    .line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="570" height="218" fill="#fffdf6"/>
  <text x="138" y="30" class="" text-anchor="middle">只有甲已就坐</text><path d="M92,72 L175,72" class="line" stroke="#286865" stroke-width="5"/><path d="M92,72 L175,151" class="line" stroke="#8a9b91" stroke-width="2" stroke-dasharray="5 5"/><path d="M92,151 L175,72" class="line" stroke="#8a9b91" stroke-width="2" stroke-dasharray="5 5"/><circle cx="92" cy="72" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="74" y="77" class="label" text-anchor="middle">甲</text><circle cx="92" cy="151" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="74" y="156" class="label" text-anchor="middle">乙</text><circle cx="175" cy="72" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="193" y="77" class="label" text-anchor="middle">1</text><circle cx="175" cy="151" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="193" y="156" class="label" text-anchor="middle">2</text><text x="432" y="30" class="" text-anchor="middle">乙加入后</text><path d="M386,72 L469,72" class="line" stroke="#8a9b91" stroke-width="2" stroke-dasharray="5 5"/><path d="M386,72 L469,151" class="line" stroke="#286865" stroke-width="5"/><path d="M386,151 L469,72" class="line" stroke="#286865" stroke-width="5"/><circle cx="386" cy="72" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="368" y="77" class="label" text-anchor="middle">甲</text><circle cx="386" cy="151" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="368" y="156" class="label" text-anchor="middle">乙</text><circle cx="469" cy="72" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="487" y="77" class="label" text-anchor="middle">1</text><circle cx="469" cy="151" r="6" fill="#fbfaf1" stroke="#285b58" stroke-width="2"/><text x="487" y="156" class="label" text-anchor="middle">2</text><path d="M289,66 L289,155" class="line" stroke="#dddccd" stroke-width="1"/><text x="289" y="198" class="label" text-anchor="middle">实线为当前配对，虚线为其他可选座位。</text>
