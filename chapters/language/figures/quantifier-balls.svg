<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 175" role="img" aria-labelledby="title desc"><title id="title">看过几颗球，就能回答两个问题？</title><desc id="desc">丙是红球。至少一颗是红球：成立（已有甲这颗红球）。每一颗都是红球：不成立（已有反例，乙不是红球）。</desc><rect width="400" height="175" fill="#f8faf7"/><circle cx="75" cy="42" r="19" fill="#ad4d40"/><text x="75" y="84" fill="#08746e" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">甲 · 红球</text><circle cx="200" cy="42" r="19" fill="#356f9a"/><text x="200" y="84" fill="#9a482f" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">乙 · 蓝球</text><circle cx="325" cy="42" r="19" fill="#ad4d40"/><text x="325" y="84" fill="#08746e" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">丙 · 红球</text><line x1="26" y1="99" x2="374" y2="99" stroke="#afc5be" stroke-width="1" /><text x="200" y="127" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">至少一颗是红球　成立</text><text x="200" y="157" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">每一颗都是红球　不成立</text></svg>
