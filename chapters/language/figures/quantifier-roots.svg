<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 175" role="img" aria-labelledby="title desc"><title id="title">逐项检验 x² = x 的候选解</title><desc id="desc">代入 2 得 2² ≠ 2。至少一个数是解：成立（已有见证 0）。每一个数都是解：不成立（已有反例 2）。</desc><rect width="400" height="175" fill="#f8faf7"/><text x="75" y="42" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">x = 0</text><text x="75" y="77" fill="#08746e" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">0² = 0</text><text x="200" y="42" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">x = 1</text><text x="200" y="77" fill="#08746e" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">1² = 1</text><text x="325" y="42" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">x = 2</text><text x="325" y="77" fill="#9a482f" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">2² ≠ 2</text><line x1="26" y1="99" x2="374" y2="99" stroke="#afc5be" stroke-width="1" /><text x="200" y="127" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">至少一个数是解　成立</text><text x="200" y="157" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">每一个数都是解　不成立</text></svg>
