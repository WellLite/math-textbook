<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 282" role="img" aria-labelledby="title desc">
  <title id="title">单位圆上高于二分之一的一段弧</title>
  <desc id="desc">水平线在纵坐标二分之一处与圆交于两点。右边是角 π/6 的终点，左边是 5π/6 的终点。两点上方的圆弧符合同一不等式。</desc>
  <circle cx="216" cy="145" r="104" fill="#f4f6f0" stroke="#76938f" stroke-width="2"/>
  <g stroke="#768984" stroke-width="1" fill="none"><path d="M54 145h324m-8 -4 8 4-8 4M216 266V14m-4 8 4-8 4 8"/></g>
  <path d="M70 93H360" stroke="#a25843" stroke-dasharray="5 4" fill="none"/>
  <g stroke="#648b86" stroke-width="1.5" fill="none"><path d="M125.93 93 216 145 306.07 93"/></g>
  <path d="M125.93 93 A104 104 0 0 1 306.07 93" fill="none" stroke="#165954" stroke-width="5"/>
  <g fill="#fff" stroke="#165954" stroke-width="2.5"><circle cx="125.93" cy="93" r="4"/><circle cx="306.07" cy="93" r="4"/></g>
  <g font-family="serif" font-size="16" fill="#233f3c">
    <text x="47" y="86">y = 1/2</text><text x="96" y="117">5π/6</text><text x="310" y="117">π/6</text>
    <text x="199" y="162">O</text><text x="375" y="164">x</text><text x="229" y="21">y</text>
  </g>
</svg>
