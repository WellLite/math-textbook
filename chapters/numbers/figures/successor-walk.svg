<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 132" role="img" aria-labelledby="title desc"><title id="title">同一个后继操作，重复多少次？</title><desc id="desc">从 3 出发，取 2 次后继：3 + 2 = 5。</desc><rect width="400" height="132" fill="#f8faf7"/><line x1="25" y1="84" x2="379" y2="84" stroke="#203e43" stroke-width="2" /><line x1="33" y1="80" x2="33" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="33" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">0</text><line x1="80" y1="80" x2="80" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="80" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">1</text><line x1="127" y1="80" x2="127" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="127" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">2</text><line x1="174" y1="80" x2="174" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="174" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">3</text><line x1="221" y1="80" x2="221" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="221" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">4</text><line x1="268" y1="80" x2="268" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="268" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">5</text><line x1="315" y1="80" x2="315" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="315" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">6</text><line x1="362" y1="80" x2="362" y2="90" stroke="#203e43" stroke-width="1.5" /><text x="362" y="111" fill="#203e43" text-anchor="middle" font-size="16" font-family="system-ui,sans-serif" stroke="#f8faf7" stroke-width="3" paint-order="stroke">7</text><path d="M174 79 q23.5 -45 47 0 l-9 -6 m9 6 l1 -10" fill="none" stroke="#08746e" stroke-width="2.8"/><path d="M221 79 q23.5 -45 47 0 l-9 -6 m9 6 l1 -10" fill="none" stroke="#08746e" stroke-width="2.8"/><circle cx="174" cy="84" r="4" fill="#203e43"/><circle cx="268" cy="84" r="5" fill="#9a482f"/></svg>
